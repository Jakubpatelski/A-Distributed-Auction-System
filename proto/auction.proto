syntax = "proto3";
package auction.v1;
option go_package = "mandatory5/proto;auctionpb";

service AuctionService {
  rpc Bid(BidRequest) returns (BidResponse);
  rpc Result(ResultRequest) returns (ResultResponse);
}

// Bully chooses a leader. The remaining RPCs safely transfer and copy its state.
service ReplicationService {
  rpc Ping(Empty) returns (LeaderInfo);
  rpc Election(ElectionRequest) returns (ElectionReply);
  rpc Coordinator(CoordinatorRequest) returns (ReplicaReply);
  rpc Freeze(FreezeRequest) returns (FreezeReply);
  rpc InstallSnapshot(InstallRequest) returns (ReplicaReply);
}

message Empty {}

// A leadership term is ordered by number, then leader ID to break ties.
message Term {
  uint64 number = 1;
  uint32 leader_id = 2;
}

message Snapshot {
  Term term = 1;
  uint64 version = 2;
  repeated string bidders = 3;
  int64 highest_bid = 4;
  string highest_bidder = 5;
  int64 deadline_unix_nano = 6;
  bool closed = 7;
}

message LeaderInfo {
  Term term = 1;
  bool ready = 2;
}

message ElectionRequest {
  uint32 candidate_id = 1;
  int64 deadline_unix_nano = 2;
}
message ElectionReply {
  bool higher_alive = 1;
  LeaderInfo leader = 2;
}

message CoordinatorRequest {
  Term term = 1;
  int64 deadline_unix_nano = 2;
}
message FreezeRequest {
  Term term = 1;
  int64 deadline_unix_nano = 2;
}
message FreezeReply {
  bool granted = 1;
  Term promised = 2;
  Snapshot state = 3;
}
message InstallRequest { Snapshot state = 1; }
message ReplicaReply {
  bool accepted = 1;
  Term promised = 2;
  uint64 stored_version = 3;
}

message BidRequest {
  string bidder_id = 1;
  int64 amount = 2;
}
enum Ack {
  ACK_UNSPECIFIED = 0;
  ACK_SUCCESS = 1;
  ACK_FAIL = 2;
  ACK_EXCEPTION = 3;
}
message BidResponse { Ack ack = 1; }
message ResultRequest {}
message ResultResponse {
  bool over = 1;
  int64 highest_bid = 2;
  string highest_bidder = 3;
}
